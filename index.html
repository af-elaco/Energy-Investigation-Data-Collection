<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Energy investigation: trolley on a ramp (data collection)</title>
<style>
:root {
  --navy: #0B2545; --accent: #1D4ED8; --border: #D0D5DD; --text: #101828; --muted: #475467;
  --bg: #FFFFFF; --grey: #E4E7EC; --amber-bg: #FEF0C7; --amber: #7A2E0E; --danger: #B42318;
  --font: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; --scale: 1; --split: 50%;
}
html[data-font="arial"] { --font: Arial, Helvetica, sans-serif; }
html[data-font="verdana"] { --font: Verdana, Geneva, Tahoma, sans-serif; }
html[data-font="georgia"] { --font: Georgia, "Times New Roman", serif; }
*, *::before, *::after { box-sizing: border-box; }
html { font-size: calc(16px * var(--scale)); }
body { margin: 0; font-family: var(--font); color: var(--text); background: var(--bg); line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus { outline: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
h1 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 .75rem; }
h2 { font-size: 1.2rem; line-height: 1.3; margin: 1.1rem 0 .5rem; }
h3 { font-size: 1.05rem; margin: .9rem 0 .4rem; }
p { margin: 0 0 .75rem; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 6px 14px; border: 1px solid #98A2B3; border-radius: 6px; background: #FFFFFF; color: var(--text); cursor: pointer; font-size: 1rem; line-height: 1.2; }
.btn:hover:not(:disabled) { background: #F2F4F7; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--navy); border-color: var(--navy); color: #FFFFFF; }
.btn-primary:hover:not(:disabled) { background: #13345F; }
.btn-danger { color: var(--danger); border-color: #FDA29B; }
.btn-lg { min-height: 44px; padding: 8px 20px; font-size: 1.05rem; }
.btn-sm { min-height: 32px; padding: 4px 10px; font-size: .9375rem; }
.btn-xs { min-height: 28px; padding: 2px 8px; font-size: .875rem; }
.btn[aria-pressed="true"], .btn.on { background: #DCE6FB; border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.btn[aria-pressed="true"]::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }
.icon-btn { border: 0; background: transparent; padding: 4px; border-radius: 4px; cursor: pointer; display: inline-flex; color: var(--text); }
.icon-btn:hover { background: #E4E7EC; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; font-weight: 600; }

/* start screen */
.start { position: fixed; inset: 0; overflow: auto; background: #F2F4F7; }
.start-main { min-height: 100%; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; }
.start-card { background: #FFFFFF; border: 1px solid var(--border); border-radius: 10px; max-width: 640px; width: 100%; padding: 28px 32px; }
.start-school { color: var(--muted); font-weight: 600; margin-bottom: .25rem; }
.start-sub { color: var(--muted); font-size: 1.05rem; }
.start-form { margin: 1.25rem 0 .5rem; }
.fields { display: grid; gap: 12px; max-width: 380px; }
.frow { display: grid; gap: 4px; }
.frow label { font-weight: 600; }
.frow input, .frow select { min-height: 40px; padding: 6px 10px; border: 1px solid #98A2B3; border-radius: 6px; background: #FFFFFF; }
.continue { display: flex; flex-wrap: wrap; gap: 12px; }
.start-h { margin-top: 1.5rem; }
.start-list li { margin-bottom: .35rem; }

/* app frame */
.app { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
.topbar { position: relative; z-index: 100000; flex: none; height: 54px; background: var(--navy); color: #FFFFFF; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 10px; font-size: 14px; }
.topbar :focus-visible { outline: 3px solid #FFFFFF; outline-offset: 1px; box-shadow: 0 0 0 5px var(--accent); }
.tb-left { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; flex: 0 1 auto; }
.tb-school { font-size: 12px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-title { font-weight: 700; font-size: 15px; white-space: nowrap; }
.tb-nav { display: flex; gap: 14px; align-items: center; }
.nav-group { display: flex; gap: 4px; }
.nav-btn { position: relative; min-width: 34px; height: 34px; padding: 0 6px; border: 1px solid #98A2B3; border-radius: 5px; background: #FFFFFF; color: var(--navy); font-weight: 700; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.nav-btn.nav-wide { padding: 0 10px; }
.nav-btn.visited { background: #D0D5DD; border-bottom: 3px solid #667085; }
.nav-btn.answered { background: #13345F; color: #FFFFFF; border-color: #FFFFFF; }
.nav-btn.current { box-shadow: 0 0 0 2px var(--navy), 0 0 0 4px #FFFFFF; }
.nav-btn .nav-flag { display: none; position: absolute; top: -6px; right: -6px; width: 16px; height: 16px; border-radius: 50%; background: #FFFFFF; color: #B42318; border: 1px solid #B42318; align-items: center; justify-content: center; }
.nav-btn .nav-flag svg { width: 10px; height: 10px; }
.nav-btn.flagged .nav-flag { display: inline-flex; }
.nav-btn .nav-lock { display: none; position: absolute; bottom: -5px; right: -5px; width: 15px; height: 15px; border-radius: 50%; background: #FFFFFF; color: var(--navy); border: 1px solid var(--navy); align-items: center; justify-content: center; }
.nav-btn.locked .nav-lock { display: inline-flex; }
.nav-btn.locked { color: #475467; }
.nav-btn.sample { cursor: default; vertical-align: middle; margin-right: 6px; }
.tb-right { display: flex; align-items: center; gap: 6px; }
.tb-btn { display: inline-flex; align-items: center; gap: 5px; height: 34px; padding: 0 10px; border: 1px solid rgba(255,255,255,.55); border-radius: 5px; background: transparent; color: #FFFFFF; cursor: pointer; font-size: 14px; }
.tb-btn:hover:not(:disabled) { background: rgba(255,255,255,.12); }
.tb-btn:disabled { opacity: .45; cursor: not-allowed; }
.tb-btn[aria-pressed="true"] { background: #FFFFFF; color: #B42318; font-weight: 700; }
.tb-a { font-weight: 700; min-width: 38px; justify-content: center; padding: 0 6px; }
.timer { min-width: 68px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 16px; padding: 4px 8px; border-radius: 5px; border: 1px solid transparent; }
.timer.amber { background: var(--amber-bg); color: var(--amber); border: 2px solid #F79009; }
.tools-wrap { position: relative; }
.menu { position: absolute; right: 0; top: 40px; z-index: 80; background: #FFFFFF; color: var(--text); border: 1px solid #98A2B3; border-radius: 6px; min-width: 200px; padding: 4px; box-shadow: 0 6px 16px rgba(16,24,40,.16); }
.menu-item { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 15px; }
.menu-item:hover, .menu-item:focus { background: #EEF2FF; }
.menu-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; box-shadow: none; }
.menu-sep { height: 1px; background: var(--border); margin: 4px 2px; }
.banner { flex: none; background: #FEE4E2; color: #7A271A; border-bottom: 1px solid #FDA29B; padding: 8px 16px; font-weight: 700; }
.panes { flex: 1; display: flex; min-height: 0; }
.pane { overflow: auto; min-width: 0; padding: 16px 20px 32px; background: var(--bg); }
.stim { flex: 0 0 var(--split); }
.resp { flex: 1 1 0; }
.full { flex: 1 1 auto; }
.divider { flex: none; width: 10px; cursor: col-resize; background: #F2F4F7; border-left: 1px solid var(--border); border-right: 1px solid var(--border); position: relative; touch-action: none; }
.divider::after { content: ""; position: absolute; left: 3px; top: 50%; width: 2px; height: 36px; margin-top: -18px; border-left: 1px solid #98A2B3; border-right: 1px solid #98A2B3; }
.bottombar { flex: none; height: 54px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #FFFFFF; font-size: 15px; }
.bb-student { font-weight: 600; }
.bb-nav { display: flex; gap: 10px; }

/* content */
.inv { max-width: 860px; }
.inv-h { margin-top: .25rem; }
.rq { padding: 10px 12px; border-left: 4px solid var(--navy); background: rgba(11,37,69,.05); }
.eq { font-size: 1.15rem; font-weight: 700; margin-left: 1rem; }
.stim-h { margin-top: 0; }
.info-table { border-collapse: collapse; margin: .25rem 0 .75rem; }
.info-table th, .info-table td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; }
.info-table th { background: #F2F4F7; }
.note { color: var(--muted); }
.ct { color: #1D4ED8; font-weight: 700; cursor: help; }
.kw { border-bottom: 2px dotted currentColor; cursor: help; }
.tooltip { position: fixed; z-index: 140; max-width: 300px; background: #101828; color: #FFFFFF; padding: 8px 10px; border-radius: 6px; font-size: 14px; line-height: 1.4; pointer-events: none; }
.qhead { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--border); margin-bottom: .75rem; }
.qhead h2 { margin: 0 0 .4rem; font-size: 1.25rem; }
.marks, .pmarks { font-weight: 700; white-space: nowrap; }
.qtext { font-size: 1.0625rem; }
.qpart { margin: 0 0 1.25rem; }
.ptext { display: flex; gap: 8px; align-items: baseline; }
.ptext .qtext { flex: 1; margin-bottom: .5rem; }
.plabel { font-weight: 700; min-width: 1.6rem; }
.field { margin: .4rem 0 .6rem; }
.field-label { display: inline-block; font-weight: 600; color: var(--muted); margin: 0 6px .2rem 0; }
.ta { display: block; width: 100%; border: 1px solid #98A2B3; border-radius: 4px; padding: 8px 10px; background: var(--bg); resize: vertical; line-height: 1.5; }
.ta[readonly], .num[readonly], .tcell[readonly], .ax-in[readonly], .pin[readonly], .unit-in[readonly] { background: #F2F4F7; }
.ans-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.num { width: 9rem; min-height: 38px; border: 1px solid #98A2B3; border-radius: 4px; padding: 4px 8px; background: var(--bg); font-variant-numeric: tabular-nums; }
.num-sm { width: 6rem; min-height: 34px; }
.unit { font-weight: 700; }
.unit-in { width: 7rem; min-height: 38px; border: 1px solid #98A2B3; border-radius: 4px; padding: 4px 8px; background: var(--bg); }
.ptline { margin: .3rem 0 .6rem; }
.wordcount { color: var(--muted); font-size: .9rem; margin-top: 2px; }
.symbar { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0 6px; }
.sym { min-width: 34px; height: 32px; border: 1px solid #98A2B3; border-radius: 4px; background: #FFFFFF; cursor: pointer; font-size: 1rem; }
.sym:hover:not(:disabled) { background: #F2F4F7; }
.sym:disabled { opacity: .45; }
.muted { color: var(--muted); }

/* table tool */
.ttool-bar { display: flex; flex-wrap: wrap; gap: 6px; margin: .3rem 0 .4rem; }
.ttable-wrap { overflow-x: auto; max-width: 100%; padding: 2px; }
.ttable { border-collapse: collapse; table-layout: fixed; width: 100%; min-width: 360px; }
.ttable th, .ttable td { border: 1px solid #667085; padding: 0; background: var(--bg); }
.ttable th { background: #F2F4F7; }
.cellwrap { position: relative; }
.cellwrap.selected { box-shadow: inset 0 0 0 2px var(--accent); }
.tcell { display: block; width: 100%; border: 0; background: transparent; padding: 6px 4px; text-align: center; min-height: 36px; font-variant-numeric: tabular-nums; }
.thead-cell { resize: none; font-weight: 700; line-height: 1.3; overflow: hidden; height: 3.4em; }
.tcell:focus-visible { outline: none; }
.cellwrap.circled::after, .ring { position: relative; }
.cellwrap.circled::after { content: ""; position: absolute; left: 10%; right: 10%; top: 3px; bottom: 3px; border: 2px solid #B42318; border-radius: 50%; pointer-events: none; }
.rtable-wrap { overflow-x: auto; }
.rtable { border-collapse: collapse; margin: .25rem 0; font-variant-numeric: tabular-nums; }
.rtable th, .rtable td { border: 1px solid #667085; padding: 5px 8px; text-align: center; white-space: pre-wrap; min-width: 52px; }
.rtable th { background: #F2F4F7; }
.ring { display: inline-block; padding: 1px 7px; border: 2px solid #B42318; border-radius: 50%; }

/* graph tool */
.gtool { margin-top: .5rem; }
.axis-table { border-collapse: collapse; margin: .2rem 0 .3rem; width: 100%; max-width: 620px; }
.axis-table th, .axis-table td { padding: 3px 4px; text-align: left; }
.axis-table thead th { color: var(--muted); font-weight: 600; font-size: .9375rem; }
.axis-table tbody th { white-space: nowrap; padding-right: 8px; }
.ax-in, .axis-table select { min-height: 34px; border: 1px solid #98A2B3; border-radius: 4px; padding: 3px 8px; background: var(--bg); width: 100%; }
.gtool-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: .5rem 0 .25rem; }
.bar-gap { flex: 0 0 8px; }
.gtool-msg { min-height: 1.4em; color: var(--danger); font-weight: 600; margin: 0 0 .25rem; }
.gtool-main { display: block; }
.gsvg-wrap { max-width: 610px; }
.graph-svg { display: block; width: 100%; height: auto; border: 1px solid var(--border); background: #FFFFFF; touch-action: none; }
.graph-svg.editable { cursor: crosshair; }
.graph-view { max-width: 610px; }
.plist { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 10px; font-size: .9375rem; max-width: 640px; }
.pblock { flex: 1 1 250px; max-width: 330px; }
.lblocks { flex: 1 1 230px; max-width: 300px; }
.plist-h { font-size: 1rem; margin: .2rem 0 .3rem; }
.ptable { border-collapse: collapse; width: 100%; margin-bottom: 6px; }
.ptable th, .ptable td { border: 1px solid var(--border); padding: 2px 4px; text-align: center; font-size: .875rem; }
.ptable th { background: #F2F4F7; font-weight: 600; }
.ptable tr.sel td { background: #DCE6FB; }
.pin { width: 100%; min-width: 3.6rem; border: 1px solid #98A2B3; border-radius: 3px; padding: 2px 4px; min-height: 28px; background: var(--bg); text-align: center; }
.lblock { margin-bottom: .6rem; }
.lrow { display: grid; grid-template-columns: 4.6rem 1fr 1fr; gap: 4px; align-items: center; margin-bottom: 4px; }
.lrow span { font-size: .875rem; color: var(--muted); }

/* simulation */
.sim { max-width: 980px; }
.scene-wrap { position: relative; border: 1px solid var(--border); background: #F6F8FB; }
.scene-svg { display: block; width: 100%; height: auto; }
.svg-btn { cursor: pointer; }
.svg-btn .svg-focus { visibility: hidden; }
.svg-btn:focus .svg-focus, .svg-btn:focus-visible .svg-focus { visibility: visible; }
.svg-btn:focus { outline: none; }
.magnifier { position: absolute; right: 10px; top: 10px; width: clamp(120px, 25%, 210px); aspect-ratio: 1 / 1; border-radius: 50%; border: 0; background: transparent; overflow: hidden; box-shadow: 0 4px 12px rgba(16,24,40,.28), 0 0 0 3px #2F363E; }
.mag-svg { display: block; width: 100%; height: 100%; }
.mag-col { position: absolute; right: 10px; top: 10px; width: clamp(120px, 25%, 210px); display: flex; flex-direction: column; align-items: stretch; gap: 10px; pointer-events: none; }
.mag-col .magnifier { position: relative; right: auto; top: auto; width: 100%; }
.adjust-box { pointer-events: auto; padding: 6px 8px 8px; background: rgba(255,255,255,.95); border: 1px solid #D0D5DD; border-radius: 8px; box-shadow: 0 2px 8px rgba(16,24,40,.12); text-align: center; }
.adjust-box[hidden] { display: none; }
.adj-t { font-size: .8125rem; font-weight: 600; color: #344054; margin-bottom: 5px; }
.adj-row { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
.adj-row .btn { flex: 1 1 0; min-width: 0; padding: 4px 8px; }
.trolley.can-drag { cursor: grab; }
.trolley.dragging { cursor: grabbing; }
.sim-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 0 4px; }
.sim-sel { font-weight: 600; }
.sim-controls select { min-height: 36px; border: 1px solid #98A2B3; border-radius: 6px; padding: 4px 8px; background: #FFFFFF; }
.sim-statusrow { display: flex; flex-wrap: wrap; gap: 16px; min-height: 1.6em; }
.sim-status { color: var(--muted); font-weight: 600; }
.sim-max { color: var(--danger); font-weight: 700; }
.sim-closed { font-size: 1.1rem; font-weight: 700; padding: 24px; border: 1px dashed #98A2B3; border-radius: 8px; text-align: center; }

/* tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
.tab { border: 1px solid var(--border); border-bottom: 0; background: #F2F4F7; padding: 6px 14px; border-radius: 6px 6px 0 0; cursor: pointer; font-weight: 600; }
.tab[aria-selected="true"] { background: var(--bg); border-color: var(--navy); box-shadow: inset 0 3px 0 var(--navy); }

/* full screens */
.end1, .review { max-width: 760px; }
.review-list { list-style: none; padding: 0; margin: 0 0 1rem; }
.review-list li { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
.review-list .linkbtn { min-width: 6.5rem; text-align: left; }
.rv-status.ok { font-weight: 700; }
.rv-status.ok::before { content: "✓ "; }
.rv-status.no::before { content: "○ "; }
.rv-flag { display: inline-flex; align-items: center; gap: 4px; color: #B42318; font-weight: 700; }
.nav-key { list-style: none; padding: 0; }
.nav-key li { margin: 8px 0; display: flex; align-items: center; }
.after-submit { margin-top: 1rem; }
.btnrow { display: flex; flex-wrap: wrap; gap: 10px; margin: .5rem 0; }
.upload-note { font-weight: 700; font-size: 1.05rem; }

/* floating windows and dialogs */
.fwin { position: fixed; z-index: 60; background: #FFFFFF; border: 1px solid #98A2B3; border-radius: 8px; box-shadow: 0 6px 18px rgba(16,24,40,.18); max-width: calc(100vw - 20px); max-height: calc(100vh - 80px); display: flex; flex-direction: column; font-size: 15px; }
.fwin-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; background: #F2F4F7; border-bottom: 1px solid var(--border); border-radius: 8px 8px 0 0; cursor: move; user-select: none; touch-action: none; }
.fwin-title { font-weight: 700; }
.fwin-b { padding: 10px 12px; overflow: auto; }
.radio-group { border: 1px solid var(--border); border-radius: 6px; margin: 0 0 10px; padding: 6px 10px; }
.radio-group legend { font-weight: 700; }
.radio { display: block; padding: 3px 0; cursor: pointer; }
.howto h3 { margin-top: .6rem; }
.howto ul { margin: 0; padding-left: 1.2rem; }
.kw-panel .info-table { font-size: 14px; }
.calc { outline: none; }
.calc-screen { border: 1px solid #98A2B3; border-radius: 6px; padding: 6px 10px; margin-bottom: 8px; background: #F9FAFB; text-align: right; font-variant-numeric: tabular-nums; }
.calc-expr { min-height: 1.4em; color: var(--muted); word-break: break-all; font-size: 15px; }
.calc-res { font-size: 24px; font-weight: 700; min-height: 1.3em; word-break: break-all; }
.calc-keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.calc-key { min-height: 40px; border: 1px solid #98A2B3; border-radius: 5px; background: #F2F4F7; cursor: pointer; font-size: 16px; font-weight: 600; }
.calc-key.calc-num { background: #FFFFFF; }
.calc-key:hover { filter: brightness(.96); }
.calc-eq { grid-column: span 2; background: var(--navy); color: #FFFFFF; border-color: var(--navy); }
.dlg-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(16,24,40,.5); display: flex; align-items: center; justify-content: center; padding: 16px; }
.dlg { background: #FFFFFF; border-radius: 10px; max-width: 480px; width: 100%; padding: 20px 22px; box-shadow: 0 10px 30px rgba(16,24,40,.25); }
.dlg-title { margin: 0 0 .6rem; font-size: 1.2rem; }
.dlg-input { width: 100%; min-height: 40px; border: 1px solid #98A2B3; border-radius: 6px; padding: 6px 10px; margin: 4px 0 6px; }
.dlg-err { color: var(--danger); font-weight: 700; margin: 4px 0; }
.dlg-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 12px; }

/* teacher */
.teacher { position: fixed; inset: 0; overflow: auto; background: #F9FAFB; }
.teacher-lock { padding: 40px; }
.t-top { position: sticky; top: 0; z-index: 30; background: var(--navy); color: #FFFFFF; display: flex; align-items: center; gap: 16px; padding: 8px 16px; flex-wrap: wrap; }
.t-top :focus-visible { outline-color: #FFFFFF; }
.t-title { font-weight: 700; }
.t-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.t-tab { border: 1px solid rgba(255,255,255,.5); background: transparent; color: #FFFFFF; border-radius: 5px; padding: 5px 12px; cursor: pointer; }
.t-tab[aria-current="page"] { background: #FFFFFF; color: var(--navy); font-weight: 700; }
.t-close { margin-left: auto; }
.t-main { padding: 16px 20px 40px; }
.dropzone { border: 2px dashed #98A2B3; border-radius: 10px; padding: 20px; text-align: center; background: #FFFFFF; margin-bottom: 16px; }
.dropzone.over { border-color: var(--accent); background: #EEF2FF; }
.t-list { background: #FFFFFF; }
.nowrap { white-space: nowrap; }
.t-pick { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }

<script>
'use strict';
/* =====================================================================
   CONFIG: the only part a teacher normally edits.
   ---------------------------------------------------------------------
   Data-collection edition. Students answer every question on the paper
   task sheet; this file only runs the experiment.
   teacherPinHash holds a hash, never the plain PIN. Default PIN: 2468.
   To change it, open this file with #teacher at the end of the address,
   go to Settings > Make a hash, and paste the result here.
   ===================================================================== */
const CONFIG = {
  appVersion: '2.5.0',
  schoolName: 'NLCS Singapore',
  classList: ['8A', '8B', '8C', '8D', '8E', '8F'],
  teacherPinHash: '1a8c1a709442ce',   // hash of the teacher PIN (default 2468)
  seedSalt: 'G8U2-2026-trolley',      // change for a new cohort so every student gets new data
  maxRunsPerPoint: 15,                // runs allowed at each release point A to H
  timerSpeedMode: true                // true: the timer has a Mode button (TIME in s, SPEED in m/s); false: time only
};

/* =====================================================================
   Utilities
   ===================================================================== */

/* cyrb53: small, fast 53-bit string hash. Used for the student seed and
   for the PIN / unlock code hashes. */
function cyrb53(str, seed) {
  seed = seed || 0;
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507);
  h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507);
  h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}

/* Hash for PIN and unlock code: trimmed and upper-cased first, so the
   comparison is case-insensitive. */
function secretHash(s) {
  return cyrb53('g8u2-secret:' + String(s).trim().toUpperCase(), 97).toString(16);
}

/* mulberry32: small seeded random number generator, returns 0 <= x < 1.
   Math.random() is never used for data. */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function normName(s) {
  return String(s || '').normalize('NFKD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/\s+/g, ' ').trim();
}
function tidyName(s) { return String(s || '').replace(/\s+/g, ' ').trim(); }

function round(x, dp) { const p = Math.pow(10, dp); return Math.round(x * p) / p; }
function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
function sig(x, n) {
  if (x === null || x === undefined || !isFinite(x)) return '';
  if (x === 0) return (0).toPrecision(n);
  return Number(x).toPrecision(n).replace(/e\+?(-?\d+)/, (m, e) => '×10^' + e);
}
function nowIso() { return new Date().toISOString(); }
function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function escapeHtml(s) {
  return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function $(sel, root) { return (root || document).querySelector(sel); }
function $all(sel, root) { return Array.from((root || document).querySelectorAll(sel)); }

/* Tiny element builder: h('div', {class:'x', onclick: fn}, child, 'text') */
function h(tag, attrs) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      const v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, v);
    }
  }
  for (let i = 2; i < arguments.length; i++) appendKids(el, arguments[i]);
  return el;
}
function appendKids(el, c) {
  if (c === null || c === undefined || c === false) return;
  if (Array.isArray(c)) { c.forEach(x => appendKids(el, x)); return; }
  el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
}
const SVGNS = 'http://www.w3.org/2000/svg';
function s(tag, attrs) {
  const el = document.createElementNS(SVGNS, tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === 'text') el.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (let i = 2; i < arguments.length; i++) {
    const c = arguments[i];
    if (!c) continue;
    if (Array.isArray(c)) c.forEach(x => x && el.appendChild(x)); else el.appendChild(c);
  }
  return el;
}

function debounce(fn, ms) {
  let t = null;
  const d = function () { clearTimeout(t); t = setTimeout(fn, ms); };
  d.flush = function () { clearTimeout(t); fn(); };
  return d;
}

function downloadText(filename, text, mime) {
  const blob = new Blob([text], { type: mime || 'application/json' });
  downloadBlob(filename, blob);
}
function downloadBlob(filename, blob) {
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: filename, style: { display: 'none' } });
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}
function safeFilePart(s) {
  return String(s || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9-]+/g, '').slice(0, 30) || 'Student';
}

/* Parse a number typed by a student: accepts 0.054, .054, -1, 1,5 (comma),
   and numbers with trailing units such as "0.054 s". Returns NaN if none. */
function parseNum(str) {
  if (str === null || str === undefined) return NaN;
  const t = String(str).replace(/,/g, '.').replace(/[−–]/g, '-').trim();
  const m = t.match(/-?\d*\.?\d+(?:e-?\d+)?/i);
  if (!m) return NaN;
  return parseFloat(m[0]);
}
function mean(arr) { return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : NaN; }
function linFit(xs, ys) {
  const n = xs.length, mx = mean(xs), my = mean(ys);
  let sxy = 0, sxx = 0;
  for (let i = 0; i < n; i++) { sxy += (xs[i] - mx) * (ys[i] - my); sxx += (xs[i] - mx) * (xs[i] - mx); }
  const m = sxy / sxx; return { m, c: my - m * mx };
}

/* =====================================================================
   PHYSICS MODEL AND DATA GENERATOR
   ---------------------------------------------------------------------
   Friction and drag are modelled as one constant resistive force F that
   acts along the ramp. The trolley keeps a fraction k of its
   gravitational potential energy as kinetic energy at the light gate:

       F / m = g sin(theta) (1 - k)
       v^2   = 2 g h - 2 (F/m) d = 2 g h k        (h = d sin theta)

   Because F acts over a distance d that is proportional to h, v^2 stays
   directly proportional to h. The measured gradient of v^2 against h is
   2gk = 19.6k (m/s^2) instead of the predicted 2g = 19.6 m/s^2
   (g = 9.8 N/kg).

   VARIATION, AS IN A REAL LAB. Every value is seeded, so the same student
   always gets the same data, and no two students get the same data.

   Run to run (each run n, or each placement q):
   1. Placing the trolley: the front wheel sits dd from the mark along the
      ramp, dd ~ Normal(0, 2 mm), clipped to +/-5 mm. So h changes by up to
      about 1.5 mm, and the magnifier shows the real height.
   2. Letting go by hand: a tiny push or drag changes v^2 by
      r ~ Normal(0, 0.04 m^2/s^2), clipped to +/-0.10. This matters most for
      the low release points, where v^2 is small.
   3. Friction: k changes by a fraction c ~ Normal(0, 2.2%), clipped to +/-5.5%
      (dust, the axles, the line the trolley takes down the ramp).
   4. Card and beam: the trolley wobbles and the card cuts the beam slightly
      early or late, j ~ Normal(0, 0.6 ms), clipped to +/-1.4 ms.

   Mark to mark (the same for every run from one mark):
   5. Each mark has its own small, steady difference sp (bumps and uneven
      patches on the board). For A, C, E, G and H the differences are chosen
      so that, by least squares, they do not tilt the v^2 against h line or
      move it away from the origin: they only scatter the points. Their size
      is the same for every student (RMS 2.6% of v^2 at H, at most 10% of
      v^2 at a mark), so every graph needs a line of best fit.

       v_run^2 = 2 g h k (1 + sp) (1 + c) + r,    t = L / v_run + j   (shown to 0.001 s)

   Checked over 160 students (A, C, E, G, H, three runs each):
   - points scatter 0.3 to 2.2 small squares (RMS, median 1.1) around each
     student's own line of best fit (vertical scale 8 or 10 m^2/s^2);
   - gradients 15.7 to 19.5 m/s^2 (always below the predicted 20);
     intercepts within +/-0.31 m^2/s^2 of the origin;
   - at A the three readings are all different 7 times in 10; at H all
     three match about 1 time in 6, and all three differ about 1 time in 4;
   - no two students have the same set of readings.
   Set PHYS.noise = 0 to switch every effect off (sample table check).

   Anomalous run: the student's Nth run overall uses v_run = v * f, where
   v includes the mark's steady difference (released below the mark, or a
   wheel rubbed). Its time is 9% to 19% longer than the mean of the other
   runs at that mark, and at least twice their spread (checked over 160
   students), so it does not fit the pattern.
   Light gate: t = L / v_run, L = 0.100 m, shown to 3 decimal places.
   ===================================================================== */
const PHYS = {
  g: 9.8,               // N/kg
  m: 0.500,             // kg
  L: 0.100,             // card length, m
  rampLen: 1.20,        // m
  spacing: 0.15,        // release marks every 0.15 m along the ramp
  points: ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'],
  cushionDist: 0.40,    // foam cushion face, m past the bottom of the ramp
  gateDist: 0.12,       // light gate beam, m past the bottom of the ramp (trolley is level here)
  noise: 1,             // 1 = normal lab variation, 0 = none
  placeSD: 0.002, placeClip: 0.005,        // m along the ramp
  adjustMax: 0.025,                        // Raise, Lower and drag: the front wheel stays within 0.025 m (along the ramp) of the mark
  releaseSD: 0.04, releaseClip: 0.10,      // m^2/s^2 added to v^2
  frictionSD: 0.022, frictionClip: 0.055,  // fraction of k
  gateSD: 0.0006, gateClip: 0.0014,        // s added to the time
  pointSD: 0.026, pointClip: 0.10          // mark-to-mark scatter: change in v^2 as a fraction of v^2 at H (A, C, E, G, H)
};

/* Seed: cyrb53 hash of normalised first + last name + class + salt. */
function seedFor(first, last, cls) {
  const str = normName(first) + ' ' + normName(last) + '|' + normName(cls) + '|' + CONFIG.seedSalt;
  const hsh = cyrb53(str);
  return { hash: hsh, seed32: hsh >>> 0, code: seedCode(hsh) };
}
/* 6-character code shown on the submission and in teacher mode only. */
function seedCode(hsh) {
  const al = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let x = Math.floor(hsh / 2048), out = '';
  for (let i = 0; i < 6; i++) { out += al[x % al.length]; x = Math.floor(x / al.length); }
  return out;
}

/* Seeded values per student (ranges from Section 5). */
function paramsFromSeed(seed32) {
  const r = mulberry32(seed32);
  r(); // discard the first value
  const sinT = round(0.320 + 0.025 * r(), 4);    // 0.320 to 0.345
  const k = round(0.82 + 0.08 * r(), 3);         // 0.82 to 0.90
  const N = 5 + Math.floor(r() * 5);             // 5 to 9
  const f = round(0.86 + 0.03 * r(), 3);         // 0.86 to 0.89
  return { sinT, k, N, f, seed32 };
}

function releaseDistance(i) { return PHYS.spacing * (i + 1); }        // A = 0.15 m ... H = 1.20 m
function trueHeight(p, i) { return releaseDistance(i) * p.sinT; }     // h = d sin(theta)
function predictedSpeed(h) { return Math.sqrt(2 * PHYS.g * h); }      // mgh = 1/2 m v^2
function modelSpeed(h, k) { return Math.sqrt(2 * PHYS.g * h * k); }   // v^2 = 2 g h k
function timerReading(v) { return Math.round((PHYS.L / v) * 1000) / 1000; }
/* SPEED mode of the light gate timer. The timer divides the card length by
   the time it shows (0.001 s resolution), so the speed always agrees with a
   student's own v = 0.100 m / t. Shown to 3 significant figures:
   0.926 m/s, 1.31 m/s, 2.63 m/s. Before a measurement it shows 0.00. */
function speedReading(tStr) {
  const t = Number(tStr);
  if (!(t > 0)) return '0.00';
  const v = PHYS.L / t;
  return v < 0.9995 ? v.toFixed(3) : v.toFixed(2);
}

/* Seeded standard normal value for one effect of one run (Box-Muller).
   stream: 1 placement, 2 release, 3 friction, 4 light gate. */
function seededNormal(seed32, n, stream) {
  const r = mulberry32((seed32 ^ Math.imul(n, 0x9E3779B1) ^ Math.imul(stream, 0x85EBCA6B)) >>> 0);
  r();
  let u1 = r(); if (u1 < 1e-12) u1 = 1e-12;
  const u2 = r();
  return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
}
function effect(seed32, n, stream, sd, clip) { return PHYS.noise * clamp(sd * seededNormal(seed32, n, stream), -clip, clip); }

/* Each release mark has its own steady difference (bumps and uneven patches
   on the board, the slightly different line the trolley takes from that
   mark). It changes v^2 by the same fraction for every run from mark i, so
   the plotted means scatter around the line instead of sitting on it. */
const METHOD_POINTS = [0, 2, 4, 6, 7];   // A, C, E, G, H: the points the task sheet uses
function pointFactors(p) {
  if (p._pf && p._pfNoise === PHYS.noise) return p._pf;
  const f = PHYS.points.map((_, i) => PHYS.pointSD * seededNormal(p.seed32, i + 1, 5));   // B, D, F: plain random
  // A, C, E, G, H. Work with the change in v^2 at each mark (as a fraction of
  // v^2 at H). Start from random values, a little smaller for the low marks,
  // then remove any part that would tilt the line of v^2 against h or move it
  // away from the origin (least squares), and scale to the same size for every
  // student. So the points always scatter, but the gradient does not change.
  const xs = METHOD_POINTS.map(i => i + 1), xH = 8;
  let dev = METHOD_POINTS.map((i, j) => seededNormal(p.seed32, i + 1, 5) * Math.pow(xs[j] / xH, 0.6));
  const ortho = [];
  [xs.map(() => 1), xs.slice()].forEach(v => { let w = v.slice(); ortho.forEach(o => { const d = w.reduce((a, x, j) => a + x * o[j], 0); w = w.map((x, j) => x - d * o[j]); }); const nrm = Math.sqrt(w.reduce((a, x) => a + x * x, 0)); ortho.push(w.map(x => x / nrm)); });
  ortho.forEach(o => { const d = dev.reduce((a, x, j) => a + x * o[j], 0); dev = dev.map((x, j) => x - d * o[j]); });
  const rms = Math.sqrt(dev.reduce((a, x) => a + x * x, 0) / dev.length) || 1;
  METHOD_POINTS.forEach((i, j) => { f[i] = PHYS.pointSD * (dev[j] / rms) * xH / xs[j]; });   // back to a fraction of v^2 at that mark
  p._pf = f.map(x => PHYS.noise * clamp(x, -PHYS.pointClip, PHYS.pointClip)); p._pfNoise = PHYS.noise;
  return p._pf;
}
function pointFactor(p, i) { return pointFactors(p)[i]; }

/* Where the front wheel ends up for placement q (m along the ramp; + is higher up). */
function placeOffset(seed32, q) { return effect(seed32, q, 1, PHYS.placeSD, PHYS.placeClip); }

/* One run from release point index i, as the nth run overall, with the
   trolley placed dd from the mark. */
function makeRun(p, i, n, dd) {
  dd = dd || 0;
  const d = releaseDistance(i) + dd;
  const hgt = d * p.sinT;
  const vModel = modelSpeed(hgt, p.k);
  const sp = pointFactor(p, i);                          // steady difference for this mark
  let vr, t, rel = 0, fr = 0, jit = 0, anomaly = false;
  if (n === p.N) {                                       // anomalous run
    anomaly = true; vr = vModel * Math.sqrt(1 + sp) * p.f; t = timerReading(vr);
  } else {
    rel = effect(p.seed32, n, 2, PHYS.releaseSD, PHYS.releaseClip);
    fr = effect(p.seed32, n, 3, PHYS.frictionSD, PHYS.frictionClip);
    jit = effect(p.seed32, n, 4, PHYS.gateSD, PHYS.gateClip);
    vr = Math.sqrt(Math.max(0.01, 2 * PHYS.g * hgt * p.k * (1 + sp) * (1 + fr) + rel));
    t = Math.round((PHYS.L / vr + jit) * 1000) / 1000;
  }
  const eps = anomaly ? null : vr / vModel - 1;          // speed change from all effects (for the run log)
  return { n, idx: i, point: PHYS.points[i], d, dd, h: hgt, sp, eps, rel, fr, jit, anomaly, v: vr, t };
}

/* Trolley geometry, measured from the front wheel's contact point (m). */
const TROLLEY = { wheelbase: 0.12, wheelR: 0.02, nose: 0.045, cardBack: 0.095, cardFwd: 0.005 };

/* Motion used by the animation only (real time, seconds). It never changes
   the timer reading. d = release distance along the ramp for this run.
   Ramp: constant acceleration. Bench: the same resistive force slows the
   trolley. Foam: the spring plunger presses into the foam, which squashes
   and pushes the trolley back a little before it settles. */
function runKinematics(p, d, vRun) {
  const aRamp = vRun * vRun / (2 * d);
  const tRamp = 2 * d / vRun;
  const b = PHYS.g * p.sinT * (1 - p.k);
  const uc = PHYS.cushionDist - TROLLEY.nose;            // front wheel position when the plunger meets the foam
  const disc = vRun * vRun - 2 * b * uc;
  const kin = { d, aRamp, tRamp, b, vRun, uc, contact: disc > 0 };
  if (!kin.contact) {                                    // stops before the foam
    kin.tBench = vRun / b; kin.stopAt = vRun * vRun / (2 * b);
    kin.tSq = 0; kin.tBack = 0; kin.back = 0;
  } else {
    const vc = Math.sqrt(disc);
    kin.vc = vc; kin.tBench = (vRun - vc) / b;
    kin.comp = clamp(0.006 + 0.006 * vc, 0.006, 0.022);   // how far the foam squashes
    kin.w = vc / kin.comp; kin.tSq = Math.PI / kin.w;      // squash and spring back
    kin.vBack = 0.12 * vc;                                 // most of the energy stays in the foam
    kin.back = Math.min(0.025, kin.vBack * kin.vBack / (2 * Math.max(b, 0.2)));   // rolls back a little, then stops
    kin.tBack = kin.back > 0 ? 2 * kin.back / kin.vBack : 0;
    kin.stopAt = uc - kin.back;
  }
  kin.total = tRamp + kin.tBench + kin.tSq + kin.tBack;
  return kin;
}
/* Front-wheel path position u (m) at time tau: u < 0 on the ramp, u > 0 on the bench. */
function positionAt(kin, tau) {
  if (tau <= 0) return -kin.d;
  if (tau < kin.tRamp) return -(kin.d - 0.5 * kin.aRamp * tau * tau);
  let t = tau - kin.tRamp;
  if (!kin.contact) { t = Math.min(t, kin.tBench); return Math.min(kin.vRun * t - 0.5 * kin.b * t * t, kin.stopAt); }
  if (t < kin.tBench) return kin.vRun * t - 0.5 * kin.b * t * t;
  t -= kin.tBench;
  if (t < kin.tSq) return kin.uc + kin.comp * Math.sin(kin.w * t);
  t -= kin.tSq;
  if (t < kin.tBack) { const ab = kin.vBack / kin.tBack; return kin.uc - (kin.vBack * t - 0.5 * ab * t * t); }
  return kin.stopAt;
}

/* Expected values for teacher mode. */
function expectedValues(p) {
  const rows = PHYS.points.map((pt, i) => {
    const hgt = trueHeight(p, i);
    const vp = predictedSpeed(hgt), vm = modelSpeed(hgt, p.k);
    return {
      point: pt, d: releaseDistance(i), h: hgt, vPred: vp, vModel: vm,
      t: timerReading(vm), v2Pred: vp * vp, v2Model: vm * vm,
      gpe: PHYS.m * PHYS.g * hgt, dissipated: PHYS.m * PHYS.g * hgt * (1 - p.k)
    };
  });
  return { rows, gradient: 2 * PHYS.g * p.k };
}

/* ---------- run record file ----------

   glance, and signed with a checksum so the teacher view can see edits.
   This is a light check, not real security. */
const REC_KEY = 'trolley-ramp-g8u2';

  const payload = { runLog: state.runLog, created: state.created, logins: state.logins };
  const data = encodeRuns(payload);
  return {
    app: 'G8U2D', kind: 'runrecord', appVersion: CONFIG.appVersion,
    student: state.student, seedCode: state.seedCode, savedAt: nowIso(), runs: state.runLog.length,
    data, check: cyrb53(data + '|' + state.seedCode + '|' + CONFIG.seedSalt).toString(36)
  };
}

  return 'G8U2_runs_' + safeFilePart(state.student.cls) + '_' + safeFilePart(state.student.last) + '_' + safeFilePart(state.student.first) + '.json';

  if (!rec || rec.app !== 'G8U2D' || rec.kind !== 'runrecord' || !rec.data) throw new Error('not a run record');
  const ok = cyrb53(rec.data + '|' + rec.seedCode + '|' + CONFIG.seedSalt).toString(36) === rec.check;
  const payload = decodeRuns(rec.data);
  return { student: rec.student, seedCode: rec.seedCode, savedAt: rec.savedAt, runLog: payload.runLog || [], created: payload.created, logins: payload.logins || [], checkOk: ok };
}

/* Convert content markup to HTML. */
function md(str) {  // eslint-disable-line no-unused-vars
  let out = escapeHtml(str);
  out = out.replace(/\[\[([^\]]+)\]\]/g, (m, t) => '<strong class="ct" tabindex="0" data-ct="' + t + '">' + t + '</strong>');
  out = out.replace(/\{([^}|]+)(?:\|([^}]+))?\}/g, (m, disp, key) => '<span class="kw" tabindex="0" data-kw="' + (key || disp) + '">' + disp + '</span>');
  return out;
}
function mdPlain(str) { // same text with no markup (used in print and Word checks)
  return String(str).replace(/\[\[([^\]]+)\]\]/g, '$1').replace(/\{([^}|]+)(?:\|([^}]+))?\}/g, '$1');
}
function fieldAttrs(extra) {
  return Object.assign({ spellcheck: 'false', autocomplete: 'off', autocorrect: 'off', autocapitalize: 'off' }, extra || {});
}

/* ---------------- Dialogs (never alert / confirm / prompt) ---------------- */
let dialogOpen = 0;
function dialog(opts) {
  return new Promise(resolve => {
    const prevFocus = document.activeElement;
    const titleId = 'dlg-t-' + Math.random().toString(36).slice(2);
    const errEl = h('p', { class: 'dlg-err', role: 'alert', hidden: true });
    let inputEl = null;
    if (opts.input) {
      inputEl = h('input', fieldAttrs({ type: opts.input.type || 'text', class: 'dlg-input', 'aria-label': opts.input.label || opts.title, inputmode: opts.input.inputmode || null }));
    }
    const close = (val) => {
      overlay.remove(); dialogOpen--;
      document.removeEventListener('keydown', onKey, true);
      if (prevFocus && prevFocus.focus) try { prevFocus.focus(); } catch (e) { /* ignore */ }
      resolve(val);
    };
    const buttons = (opts.buttons || [{ label: 'OK', value: true, primary: true }]).map(b => h('button', {
      class: 'btn' + (b.primary ? ' btn-primary' : '') + (b.danger ? ' btn-danger' : ''), type: 'button',
      onclick: async () => {
        if (b.validate && inputEl) {
          const msg = await b.validate(inputEl.value);
          if (msg) { errEl.textContent = msg; errEl.hidden = false; inputEl.select(); inputEl.focus(); return; }
        }
        close(inputEl && b.value !== false && b.value !== null ? { value: b.value, input: inputEl.value } : b.value);
      }
    }, b.label));
    const body = typeof opts.body === 'string' ? h('p', { text: opts.body }) : opts.body;
    const box = h('div', { class: 'dlg', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': titleId },
      h('h2', { id: titleId, class: 'dlg-title', text: opts.title || '' }),
      body, inputEl, errEl,
      h('div', { class: 'dlg-buttons' }, buttons));
    const overlay = h('div', { class: 'dlg-overlay' }, box);
    function onKey(e) {
      if (!document.body.contains(overlay)) return;
      if (e.key === 'Escape') {
        const c = (opts.buttons || []).find(b => b.cancel);
        if (c || (opts.buttons || []).length <= 1) { e.preventDefault(); e.stopPropagation(); close(c ? c.value : true); }
      } else if (e.key === 'Enter' && inputEl && document.activeElement === inputEl) {
        e.preventDefault(); const pb = buttons.find((b, i) => (opts.buttons || [])[i].primary); if (pb) pb.click();
      } else if (e.key === 'Tab') {
        const f = $all('button, input, textarea, select', box).filter(x => !x.disabled);
        if (!f.length) return;
        const i = f.indexOf(document.activeElement);
        if (e.shiftKey && (i <= 0)) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
      }
    }
    document.addEventListener('keydown', onKey, true);
    document.getElementById('dialog-root').appendChild(overlay);
    dialogOpen++;
    setTimeout(() => { (inputEl || buttons.find((b, i) => (opts.buttons || [{ primary: true }])[i].primary) || buttons[0]).focus(); }, 20);
  });
}

const Win = {
  open: {}, z: 60, count: 0,
  show(id, title, buildContent, opts) {
    opts = opts || {};
    if (this.open[id]) { this.front(this.open[id]); const f = this.open[id].querySelector('.fwin-h'); f.focus(); return this.open[id]; }
    const titleId = 'fw-' + id;
    const closeBtn = h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Close ' + title, html: ICONS.close, onclick: () => this.close(id) });
    const head = h('div', { class: 'fwin-h', tabindex: '0', 'aria-label': title + ' window. Use the arrow keys to move it.' },
      h('span', { id: titleId, class: 'fwin-title', text: title }), closeBtn);
    const body = h('div', { class: 'fwin-b' });
    const win = h('div', { class: 'fwin', role: 'dialog', 'aria-labelledby': titleId, 'data-win': id, style: { width: (opts.width || 360) + 'px' } }, head, body);
    body.appendChild(buildContent(win));
    document.getElementById('windows').appendChild(win);
    const off = (this.count++ % 5) * 24;
    const x = opts.x !== undefined ? opts.x : Math.max(10, window.innerWidth - (opts.width || 360) - 40 - off);
    const y = opts.y !== undefined ? opts.y : 70 + off;
    win.style.left = x + 'px'; win.style.top = y + 'px';
    this.open[id] = win; this.front(win);
    // drag by the title bar
    head.addEventListener('pointerdown', e => {
      if (e.target.closest('button')) return;
      e.preventDefault(); head.setPointerCapture(e.pointerId);
      const sx = e.clientX, sy = e.clientY, ox = win.offsetLeft, oy = win.offsetTop;
      const move = ev => { this.place(win, ox + ev.clientX - sx, oy + ev.clientY - sy); };
      const up = () => { head.removeEventListener('pointermove', move); head.removeEventListener('pointerup', up); };
      head.addEventListener('pointermove', move); head.addEventListener('pointerup', up);
    });
    head.addEventListener('keydown', e => {
      const d = { ArrowLeft: [-20, 0], ArrowRight: [20, 0], ArrowUp: [0, -20], ArrowDown: [0, 20] }[e.key];
      if (d) { e.preventDefault(); this.place(win, win.offsetLeft + d[0], win.offsetTop + d[1]); }
    });
    win.addEventListener('pointerdown', () => this.front(win));
    win.addEventListener('keydown', e => { if (e.key === 'Escape' && !dialogOpen) { e.stopPropagation(); this.close(id); } });
    setTimeout(() => { const f = opts.focus ? win.querySelector(opts.focus) : head; (f || head).focus(); }, 10);
    return win;
  },
  place(win, x, y) {
    x = clamp(x, -win.offsetWidth + 80, window.innerWidth - 80);
    y = clamp(y, 56, window.innerHeight - 40);
    win.style.left = x + 'px'; win.style.top = y + 'px';
  },
  front(win) { win.style.zIndex = ++this.z; },
  close(id) {
    const w = this.open[id]; if (!w) return;
    w.remove(); delete this.open[id];
    const tb = document.getElementById('btn-tools'); if (tb && document.activeElement === document.body) tb.focus();
  },
  closeAll() { Object.keys(this.open).forEach(id => this.close(id)); }
};

/* ---------------- Calculator ----------------
   Own parser (no eval). Keys: 0-9 . + − × ÷ ( ) x² √ ± C CE = Ans.
   Keyboard: digits . + - * / ( ) ^ (square) r (root) Enter = Backspace Delete Escape(C) */
const Calc = {
  expr: '', result: '', ans: 0, justEvaluated: false, exprEl: null, resEl: null,
  build() {
    this.exprEl = h('div', { class: 'calc-expr', 'aria-label': 'Calculation' });
    this.resEl = h('div', { class: 'calc-res', 'aria-live': 'polite', 'aria-label': 'Result' });
    const keys = [
      ['C', 'clear'], ['CE', 'ce'], ['(', '('], [')', ')'], ['÷', '÷'],
      ['7', '7'], ['8', '8'], ['9', '9'], ['×', '×'], ['x²', '²'],
      ['4', '4'], ['5', '5'], ['6', '6'], ['−', '−'], ['√', '√'],
      ['1', '1'], ['2', '2'], ['3', '3'], ['+', '+'], ['±', 'neg'],
      ['0', '0'], ['.', '.'], ['Ans', 'Ans'], ['=', '=']
    ];
    const names = { '²': 'square', '√': 'square root', 'neg': 'change sign', clear: 'clear all', ce: 'clear entry', '−': 'minus', '÷': 'divide', '×': 'times', '+': 'plus', '=': 'equals', '(': 'open bracket', ')': 'close bracket', '.': 'decimal point', Ans: 'answer' };
    const grid = h('div', { class: 'calc-keys' }, keys.map(([lab, k]) => h('button', {
      type: 'button', class: 'calc-key' + (k === '=' ? ' calc-eq' : '') + (/^[0-9.]$/.test(k) ? ' calc-num' : ''),
      'aria-label': names[k] || lab, onclick: () => this.press(k)
    }, lab)));
    const wrap = h('div', { class: 'calc', tabindex: '-1' }, h('div', { class: 'calc-screen' }, this.exprEl, this.resEl), grid);
    wrap.addEventListener('keydown', e => this.key(e));
    this.render();
    return wrap;
  },
  key(e) {
    if (e.target && (e.target.classList.contains('fwin-h'))) return;
    const map = { '*': '×', 'x': '×', 'X': '×', '/': '÷', '-': '−', '+': '+', '^': '²', 'r': '√', 'R': '√', 'Enter': '=', '=': '=', 'Backspace': 'back', 'Delete': 'ce', '(': '(', ')': ')', '.': '.', ',': '.' };
    let k = null;
    if (/^[0-9]$/.test(e.key)) k = e.key; else if (map[e.key]) k = map[e.key];
    else if (e.key === 'Escape') return;
    if (k) { e.preventDefault(); this.press(k); }
  },
  press(k) {
    if (k === 'clear') { this.expr = ''; this.result = ''; this.justEvaluated = false; return this.render(); }
    if (k === 'ce') { this.expr = this.expr.replace(/(Ans|\d*\.?\d+\.?|.)$/, ''); this.justEvaluated = false; return this.render(); }
    if (k === 'back') { this.expr = this.expr.replace(/(Ans|.)$/, ''); return this.render(); }
    if (k === '=') {
      try { const v = this.evaluate(this.expr); this.ans = v; this.result = this.fmt(v); }
      catch (err) { this.result = 'Error'; }
      this.justEvaluated = true; return this.render();
    }
    if (k === 'neg') {
      const m = this.expr.match(/(\(−)?((?:\d*\.?\d+\.?)|Ans)(\))?$/);
      if (m && m[1] && m[3]) this.expr = this.expr.slice(0, -m[0].length) + m[2];
      else if (m) this.expr = this.expr.slice(0, -m[0].length) + '(−' + m[2] + ')';
      else this.expr += '(−';
      return this.render();
    }
    if (this.justEvaluated) {
      if (/^[0-9.(√]$/.test(k) || k === 'Ans') this.expr = '';
      else if (this.result !== 'Error') this.expr = 'Ans';
      this.justEvaluated = false;
    }
    this.expr += k; this.render();
  },
  fmt(v) {
    if (!isFinite(v)) throw new Error('bad');
    if (v === 0) return '0';
    const a = Math.abs(v);
    if (a >= 1e10 || a < 1e-6) return v.toExponential(6).replace(/\.?0+e/, 'e');
    return String(parseFloat(v.toPrecision(10)));
  },
  evaluate(str) {
    const toks = []; let i = 0;
    while (i < str.length) {
      const c = str[i];
      if (/[0-9.]/.test(c)) { let j = i; while (j < str.length && /[0-9.]/.test(str[j])) j++; const t = str.slice(i, j); if ((t.match(/\./g) || []).length > 1) throw new Error('num'); toks.push({ t: 'n', v: parseFloat(t) }); i = j; }
      else if (str.startsWith('Ans', i)) { toks.push({ t: 'n', v: this.ans }); i += 3; }
      else { toks.push({ t: c }); i++; }
    }
    let p = 0;
    const peek = () => toks[p] && toks[p].t;
    const startsFactor = t => t === 'n' || t === '(' || t === '√';
    const primary = () => {
      const tk = toks[p];
      if (!tk) throw new Error('end');
      if (tk.t === 'n') { p++; return tk.v; }
      if (tk.t === '(') { p++; const v = expr(); if (peek() === ')') p++; return v; }
      if (tk.t === '√') { p++; const v = unary(); if (v < 0) throw new Error('root'); return Math.sqrt(v); }
      throw new Error('tok');
    };
    const power = () => { let v = primary(); while (peek() === '²') { p++; v = v * v; } return v; };
    const unary = () => { if (peek() === '−') { p++; return -unary(); } if (peek() === '+') { p++; return unary(); } return power(); };
    const term = () => {
      let v = unary();
      for (;;) {
        if (peek() === '×') { p++; v *= unary(); }
        else if (peek() === '÷') { p++; const d = unary(); if (d === 0) throw new Error('div0'); v /= d; }
        else if (startsFactor(peek())) { v *= unary(); }
        else break;
      }
      return v;
    };
    const expr = () => { let v = term(); for (;;) { if (peek() === '+') { p++; v += term(); } else if (peek() === '−') { p++; v -= term(); } else break; } return v; };
    if (!toks.length) return 0;
    const v = expr();
    if (p < toks.length) throw new Error('extra');
    return v;
  },
  render() { if (this.exprEl) { this.exprEl.textContent = this.expr || ' '; this.resEl.textContent = this.result || '0'; } }
};

const BGS = [['white', 'White', '#FFFFFF'], ['cream', 'Cream', '#FFF8E1'], ['blue', 'Light blue', '#E8F1FB'], ['green', 'Light green', '#EAF5EA'], ['grey', 'Light grey', '#F0F1F3']];

  const d = (state && state.display) || { scale: 0, font: 'standard', bg: 'white' };

  root.style.setProperty('--scale', SCALES[d.scale] || 1);
  root.dataset.font = d.font;
  const bg = BGS.find(b => b[0] === d.bg) || BGS[0];
  root.style.setProperty('--bg', bg[2]);
  const sm = document.getElementById('btn-smaller'), lg = document.getElementById('btn-larger');
  if (sm) sm.disabled = d.scale <= 0; if (lg) lg.disabled = d.scale >= SCALES.length - 1;

/* ---------------- Tools menu ---------------- */
function initToolsMenu() {
  const btn = document.getElementById('btn-tools');
  const menu = document.getElementById('tools-menu');
  const items = [
    ['Calculator', openCalculator], ['Formula sheet', openFormulaSheet], ['Key words', openKeyWords],
    ['Display settings', openDisplaySettings], ['How to use', openHowTo],
    ['Save run record', saveRunRecord]
  ];
  menu.innerHTML = '';
  items.forEach(([lab, fn], i) => {
    if (i === 5) menu.appendChild(h('div', { class: 'menu-sep', role: 'separator' }));  // before Save run record
    menu.appendChild(h('button', { type: 'button', role: 'menuitem', class: 'menu-item', tabindex: '-1', onclick: () => { closeMenu(false); fn(); } }, lab));
  });
  const mItems = () => $all('.menu-item', menu);
  function openMenu() { menu.hidden = false; btn.setAttribute('aria-expanded', 'true'); mItems()[0].focus(); }
  function closeMenu(focusBtn) { menu.hidden = true; btn.setAttribute('aria-expanded', 'false'); if (focusBtn) btn.focus(); }
  btn.addEventListener('click', () => (menu.hidden ? openMenu() : closeMenu(true)));
  btn.addEventListener('keydown', e => { if (e.key === 'ArrowDown') { e.preventDefault(); openMenu(); } });
  menu.addEventListener('keydown', e => {
    const list = mItems(); const i = list.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); list[(i + 1) % list.length].focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); list[(i - 1 + list.length) % list.length].focus(); }
    else if (e.key === 'Home') { e.preventDefault(); list[0].focus(); }
    else if (e.key === 'End') { e.preventDefault(); list[list.length - 1].focus(); }
    else if (e.key === 'Escape') { e.preventDefault(); closeMenu(true); }
    else if (e.key === 'Tab') closeMenu(false);
  });
  document.addEventListener('pointerdown', e => { if (!menu.hidden && !menu.contains(e.target) && e.target !== btn && !btn.contains(e.target)) closeMenu(false); });
}

/* =====================================================================
   TEXTURES: drawn once at start-up on hidden canvases, then used as
   images inside the SVG scene. Nothing is downloaded, so the page still
   works offline. Decoration only: none of this affects the data.
   ===================================================================== */
const Tex = {
  cache: {},
  /* Smooth value noise (seeded) and fractal noise built from it. */
  noise(seed) {
    const P = new Uint8Array(512), r = mulberry32(seed), perm = [];
    for (let i = 0; i < 256; i++) perm[i] = i;
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
    for (let i = 0; i < 512; i++) P[i] = perm[i & 255];
    const V = new Float32Array(256); for (let i = 0; i < 256; i++) V[i] = r();
    const fade = t => t * t * (3 - 2 * t);
    const n2 = (x, y) => {
      const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
      const a = V[P[(P[xi & 255] + yi) & 511] & 255], b = V[P[(P[(xi + 1) & 255] + yi) & 511] & 255];
      const c = V[P[(P[xi & 255] + yi + 1) & 511] & 255], d = V[P[(P[(xi + 1) & 255] + yi + 1) & 511] & 255];
      const u = fade(xf), v = fade(yf);
      return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
    };
    n2.fbm = (x, y, oct) => { let s = 0, amp = 0.5, f = 1, norm = 0; for (let o = 0; o < (oct || 4); o++) { s += amp * n2(x * f, y * f); norm += amp; amp *= 0.5; f *= 2.03; } return s / norm; };
    return n2;
  },
  canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; },
  url(c) { try { return c.toDataURL('image/png'); } catch (e) { return ''; } },
  mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; },
  paint(w, h, fn) {
    const c = this.canvas(w, h), ctx = c.getContext('2d');
    if (!ctx) return '';
    const img = ctx.createImageData(w, h), d = img.data;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const col = fn(x, y), k = (y * w + x) * 4;
      d[k] = col[0]; d[k + 1] = col[1]; d[k + 2] = col[2]; d[k + 3] = col[3] === undefined ? 255 : col[3];
    }
    ctx.putImageData(img, 0, 0);
    return this.url(c);
  },
  get(name) { if (!(name in this.cache)) { try { this.cache[name] = this['make_' + name](); } catch (e) { this.cache[name] = ''; } } return this.cache[name]; },

  /* Plywood board seen edge-on: five plies, long grain in the face plies,
     darker end grain in the cross plies, a lighter worn running surface. */
  make_ply() {
    const n = this.noise(11), W = 1400, H = 44;
    const light = [226, 196, 146], dark = [184, 140, 86], cross = [170, 128, 78];
    const plies = [0, 0.16, 0.36, 0.64, 0.84, 1];
    return this.paint(W, H, (x, y) => {
      const v = y / H; let p = 0; while (p < 4 && v > plies[p + 1]) p++;
      let col;
      if (p % 2 === 0) {      // face plies: long streaky grain
        const g = n.fbm(x * 0.006, y * 0.55 + p * 7, 4), fib = n(x * 0.08, y * 1.7 + p * 3);
        const streak = Math.pow(Math.abs(Math.sin((g * 9 + y * 0.18) * Math.PI)), 6);
        col = this.mix(light, dark, 0.25 + 0.5 * streak + 0.18 * (fib - 0.5));
      } else {                // cross plies: end grain
        const g = n.fbm(x * 0.09, y * 0.9 + p * 5, 3), dot = n(x * 0.6, y * 0.6 + p) > 0.82 ? 0.25 : 0;
        col = this.mix(this.mix(light, cross, 0.55), dark, 0.25 + 0.35 * g + dot);
      }
      const edge = Math.min(Math.abs(v - plies[p]), Math.abs(plies[p + 1] - v)) * H;   // glue lines
      if (edge < 0.7 && p > 0) col = this.mix(col, [120, 86, 46], 0.55);
      if (y < 2) col = this.mix(col, [242, 222, 184], 0.6);                            // worn top edge
      const shade = 1.04 - 0.16 * v;                                                     // lit from above
      return [col[0] * shade, col[1] * shade, col[2] * shade];
    });
  },
  /* Beech metre rule: fine vertical grain with a satin varnish. */
  make_beech() {
    const n = this.noise(23), W = 48, H = 1500;
    const a = [240, 212, 158], b = [214, 176, 112];
    return this.paint(W, H, (x, y) => {
      const g = n.fbm(x * 0.35 + 3, y * 0.004, 4), f = n(x * 1.1, y * 0.05);
      const s = Math.pow(Math.abs(Math.sin((g * 7 + x * 0.12) * Math.PI)), 5);
      const col = this.mix(a, b, 0.2 + 0.55 * s + 0.12 * (f - 0.5));
      const sheen = 1 + 0.08 * Math.exp(-Math.pow((x - 14) / 7, 2));
      return [Math.min(255, col[0] * sheen), Math.min(255, col[1] * sheen), Math.min(255, col[2] * sheen)];
    });
  },
  /* Dark epoxy-resin worktop: mottled with fine speckle and a soft sheen. */
  make_resin() {
    const n = this.noise(37), W = 1400, H = 30;
    return this.paint(W, H, (x, y) => {
      const m = n.fbm(x * 0.01, y * 0.2, 4), sp = n(x * 0.9, y * 0.9);
      let v = 78 + 26 * (m - 0.5) + (sp > 0.86 ? 26 : sp < 0.1 ? -14 : 0);

      v += 18 * Math.exp(-Math.pow((y - H * 0.35) / 4, 2));          // sheen from the ceiling lights
      return [v * 0.95, v * 0.98, v * 1.04];
    });
  },
  /* Polyurethane foam: yellow with open pores. */
  make_foam() {
    const n = this.noise(41), W = 60, H = 96;
    return this.paint(W, H, (x, y) => {
      const p = n(x * 0.55, y * 0.55), q = n.fbm(x * 0.12, y * 0.12, 3);
      const base = this.mix([252, 226, 120], [228, 178, 46], 0.3 + 0.5 * q + (x / W) * 0.2);
      const pore = p < 0.22 ? 0.55 : p < 0.3 ? 0.25 : 0;
      return this.mix(base, [150, 104, 14], pore);
    });
  },
  /* Cast-iron stand base: blue-grey hammer finish. */
  make_iron() {
    const n = this.noise(53), W = 240, H = 24;
    return this.paint(W, H, (x, y) => {
      const m = n.fbm(x * 0.12, y * 0.25, 3), d = n(x * 0.5, y * 0.8);
      let v = 0.75 + 0.35 * (m - 0.5) + (d > 0.8 ? 0.12 : 0);
      v *= 1.15 - 0.45 * (y / H);
      return [58 * v, 72 * v, 92 * v];
    });
  },
  /* The lab behind the bench, softly out of focus like a photograph:
     painted wall, window light, a shelf with bottles and glassware. */
  make_backdrop() {

  /* Called when the student leaves the simulation screen mid-run. */

    state.sim.uFront = this.uf; scheduleSave();
  }
};

    if (!recs.length) { main.appendChild(h('p', {}, 'No run records loaded.')); return; }
    main.appendChild(h('table', { class: 'info-table t-list' },
      h('thead', {}, h('tr', {}, ['Name', 'Class', 'Seed code', 'Runs', 'Saved', 'File check', ''].map(x => h('th', { scope: 'col' }, x)))),
      h('tbody', {}, recs.map(r => h('tr', {},
        h('td', {}, r.student.first + ' ' + r.student.last), h('td', {}, r.student.cls), h('td', {}, r.seedCode), h('td', {}, String(r.runLog.length)), h('td', {}, fmtTime(r.savedAt)),
        h('td', {}, r.checkOk && r.seedOk !== false ? 'OK' : h('strong', {}, '! Edited or does not match the name')),
        h('td', { class: 'nowrap' },
          h('button', { type: 'button', class: 'btn btn-sm', onclick: () => { this.current = r.seedCode; this.tab = 'student'; this.render(); } }, 'View'), ' ',
          h('button', { type: 'button', class: 'btn btn-sm', onclick: () => { delete this.recs[r.seedCode]; this.persist(); this.render(); } }, 'Remove')))))));
  },
  renderStudent(main) {
    main.appendChild(h('h1', {}, 'Student run log'));
    const recs = this.sorted();
    if (!recs.length) { main.appendChild(h('p', {}, 'Load run records first, or view a student saved on this laptop.')); return; }
    if (!this.current || !this.recs[this.current]) this.current = recs[0].seedCode;
    const r = this.recs[this.current];
    const pick = h('select', { 'aria-label': 'Student' }, recs.map(x => h('option', { value: x.seedCode, selected: x.seedCode === this.current || null }, x.student.cls + '  ' + x.student.last + ', ' + x.student.first)));
    pick.addEventListener('change', () => { this.current = pick.value; this.render(); });
    main.appendChild(h('div', { class: 't-pick' }, pick, h('button', { type: 'button', class: 'btn btn-sm', onclick: () => this.print(r) }, 'Print run log')));
    if (!(r.checkOk && r.seedOk !== false)) main.appendChild(h('p', { class: 'flag-line' }, '! This file was edited after it was saved, or the seed code does not match the name and class.'));
    main.appendChild(h('section', { class: 't-box' }, h('h2', {}, 'Data the student should have'), runSummary(r)));
    main.appendChild(h('section', { class: 't-box' }, h('h2', {}, 'Expected values from the seed'), expectedPanel(r.student.first, r.student.last, r.student.cls, r.runLog)));
    main.appendChild(h('section', { class: 't-box' }, h('h2', {}, 'Run log (' + r.runLog.length + ' runs)'), runLogTable(r.runLog),
      h('p', { class: 'note' }, 'Logins: ' + (r.logins || []).map(fmtTime).join(', '))));
  },
  print(r) {
    const root = document.getElementById('print-root'); root.innerHTML = '';
    root.appendChild(h('div', { class: 'p-body' },
      h('h1', { class: 'p-title' }, 'Run log: ' + r.student.first + ' ' + r.student.last + ', ' + r.student.cls),
      h('p', {}, 'Seed code ' + r.seedCode + '. Saved ' + fmtTime(r.savedAt) + '. For the teacher only.'),
      runSummary(r), h('h2', {}, 'All runs'), runLogTable(r.runLog)));
    setTimeout(() => window.print(), 50);
  },
  csv() {
    const esc = v => { const s0 = String(v === undefined || v === null ? '' : v); return /[",\n]/.test(s0) ? '"' + s0.replace(/"/g, '""') + '"' : s0; };
    const lines = [['Name', 'Class', 'Seed code', 'Run', 'Time stamp', 'Point', 'Run at point', 'True h / m', 'Epsilon', 'Anomaly', 'Timer / s', 'Speed reading / m/s', 'Mode at release', 'Height adjusted'].join(',')];
    this.sorted().forEach(r => r.runLog.forEach(l => lines.push([r.student.first + ' ' + r.student.last, r.student.cls, r.seedCode, l.n, l.ts, l.point, l.runAtPoint, Number(l.h).toFixed(4), l.eps === null ? '' : Number(l.eps).toFixed(4), l.anomaly ? 'yes' : '', l.display, speedReading(l.display), l.mode === 'speed' ? 'speed' : 'time', l.adj ? 'yes' : ''].map(esc).join(','))));
    return lines.join('\r\n') + '\r\n';
  },
  renderExpected(main) {
    main.appendChild(h('h1', {}, 'Expected values (preview)'));
    const fn = h('input', fieldAttrs({ type: 'text', id: 'p-first' })), ln = h('input', fieldAttrs({ type: 'text', id: 'p-last' }));
    const cl = h('select', { id: 'p-class' }, CONFIG.classList.map(c => h('option', { value: c }, c)));
    const out = h('div', {});
    const form = h('form', { class: 't-form' }, h('label', { for: 'p-first' }, 'Preferred name'), fn, h('label', { for: 'p-last' }, 'Last name'), ln, h('label', { for: 'p-class' }, 'Class'), cl, h('button', { type: 'submit', class: 'btn btn-primary btn-sm' }, 'Show'));
    form.addEventListener('submit', e => { e.preventDefault(); out.innerHTML = ''; if (!fn.value.trim() || !ln.value.trim()) return; out.appendChild(expectedPanel(tidyName(fn.value), tidyName(ln.value), cl.value, null)); });
    main.appendChild(form); main.appendChild(out);
  },
  renderLaptop(main) {
    main.appendChild(h('h1', {}, 'Students saved on this laptop'));
    const idx = Store.getJSON('index', []);
    if (!idx.length) { main.appendChild(h('p', {}, 'No saved sessions on this laptop.')); return; }
    main.appendChild(h('table', { class: 'info-table t-list' },
      h('thead', {}, h('tr', {}, ['Name', 'Class', 'Seed code', 'Runs', 'Last saved', ''].map(x => h('th', { scope: 'col' }, x)))),
      h('tbody', {}, idx.map(e => h('tr', {}, h('td', {}, e.first + ' ' + e.last), h('td', {}, e.cls), h('td', {}, e.code), h('td', {}, String(e.runs || 0)), h('td', {}, fmtTime(e.updated)),
        h('td', { class: 'nowrap' },
          h('button', { type: 'button', class: 'btn btn-sm', onclick: () => {
            const st = loadSaved(e.code); if (!st) return;
            this.recs[e.code] = { student: st.student, seedCode: st.seedCode, savedAt: nowIso(), runLog: st.runLog, logins: st.logins, checkOk: true, seedOk: true };
            this.persist(); this.current = e.code; this.tab = 'student'; this.render();
          } }, 'View'), ' ',
          h('button', { type: 'button', class: 'btn btn-sm btn-danger', onclick: async () => {
            if (!(await confirmDialog('Clear saved session', 'Delete the runs of ' + e.first + ' ' + e.last + ' from this laptop? Save their run record first if you need it.', 'Delete', 'Cancel'))) return;
            Store.remove('session:' + e.code);
            try { Store.set('index', JSON.stringify(Store.getJSON('index', []).filter(x => x.code !== e.code))); if (Store.get('current') === e.code) Store.remove('current'); } catch (er) { /* ignore */ }
            if (state && state.seedCode === e.code) state = null;
            this.render();
          } }, 'Clear')))))));
  },
  renderSettings(main) {
    main.appendChild(h('h1', {}, 'Settings'));
    const inp = h('input', fieldAttrs({ type: 'text', id: 's-hash' })); const out = h('code', { class: 'hash-out' });
    inp.addEventListener('input', () => { out.textContent = inp.value.trim() ? secretHash(inp.value) : ''; });
    main.appendChild(h('section', { class: 't-box' }, h('h2', {}, 'Make a hash'), h('p', {}, 'Type a new teacher PIN. Copy the hash into CONFIG (teacherPinHash) at the top of the file.'), h('label', { for: 's-hash' }, 'PIN '), inp, h('p', {}, 'Hash: ', out)));
    main.appendChild(h('section', { class: 't-box' }, h('h2', {}, 'Current CONFIG'), h('ul', {}, ['School name: ' + CONFIG.schoolName, 'Classes: ' + CONFIG.classList.join(', '), 'Seed salt: ' + CONFIG.seedSalt, 'Maximum runs per release point: ' + CONFIG.maxRunsPerPoint, 'App version: ' + CONFIG.appVersion].map(x => h('li', {}, x)))));
  }
};

/* =====================================================================
   BOOT
   ===================================================================== */
function route() {
  if (location.hash === '#teacher') { Teacher.enter(); return; }
  Teacher.authed = false;
  if (state) App.enter(); else App.showStart();
}
function boot() {
  initTips();
  App.init();
  window.addEventListener('hashchange', route);
  route();
}
/* Hooks used by the automated acceptance tests. */
window.G8U2 = { CONFIG, PHYS, seedFor, paramsFromSeed, makeRun, placeOffset, pointFactor, timerReading, speedReading, modelSpeed, trueHeight, expectedValues, runKinematics,
  secretHash, encodeRuns, decodeRuns, Store, Sim, App, Teacher, Calc, buildRunRecord, readRunRecord, getState: () => state, getParams: () => params };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
</body>
